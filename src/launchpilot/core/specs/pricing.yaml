# Suggested per-territory pricing bands.
#
# Apple and Google let you set a different price per storefront but publish no
# guidance on what to set it to. Most developers either charge the same number
# everywhere — pricing a $2 habit tracker at a full day's minimum wage in some
# markets — or never touch regional pricing at all.
#
# `ppp_tier` is deliberately coarse: three bands from the World Bank's income
# group classification (https://datahelpdesk.worldbank.org/knowledgebase/articles/906519),
# not per-country purchasing-power-parity or Big Mac Index data, which drifts
# throughout the year and which nobody here is positioned to keep current. A
# three-band approximation that is honest about being an approximation beats a
# precise-looking number that quietly goes stale.
#
# This produces a starting point to copy into App Store Connect / Play Console
# yourself — nothing here ever calls either API.
source_url: https://datahelpdesk.worldbank.org/knowledgebase/articles/906519
last_verified: 2026-08-18

models:
  uniform:
    label: Uniform
    description: The same price in every storefront, converted at the going exchange rate.
  ppp_tier:
    label: Purchasing-power tier
    description: >-
      Scaled down in lower-income storefronts using World Bank income-group
      bands — a sanity check, not exact purchasing-power data.

# `countries` covers every storefront `market_scanner.COUNTRY_NAMES` knows
# about. A country missing from every tier below is priced at the uniform
# rate under `ppp_tier` too, rather than guessed at.
tiers:
  - id: tier_1
    label: Tier 1 — high income
    multiplier: 1.0
    countries: [us, gb, ca, au, de, fr, es, it, nl, se, jp, kr, pl]
  - id: tier_2
    label: Tier 2 — upper-middle income
    multiplier: 0.55
    countries: [br, mx, tr, cn, ru]
  - id: tier_3
    label: Tier 3 — lower-middle income
    multiplier: 0.3
    countries: [in, id]
