# Category names are already indexed from the app's chosen category, so
# repeating them in the keyword field is spend for nothing.
category_words:
  - games
  - game
  - productivity
  - utilities
  - lifestyle
  - health
  - fitness
  - education
  - finance
  - photo
  - video
  - travel
  - music
  - business
  - medical
  - weather
  - sports
  - news
  - books
  - shopping

# Naming another company's app or trademark in metadata risks rejection under
# App Review Guideline 5.2.1 as well as a trademark complaint. This list is a
# starting set of the most-commonly-attempted ones; it is not exhaustive, and
# the check is a warning rather than a verdict.
trademark_words:
  - instagram
  - facebook
  - whatsapp
  - tiktok
  - snapchat
  - youtube
  - spotify
  - netflix
  - twitter
  - google
  - iphone
  - ipad
  - apple
  - android
  - notion
  - duolingo
  - strava
  - headspace
  - calm

# Severity assigned to each detectable problem. Codes are stable and shared with
# the browser implementation.
#
# The two duplicate codes are warnings, not errors: a repeated word wastes
# keyword-field budget, but Apple does not reject a listing over it — it is
# an optimisation left on the table, the same category as ASO_NOISE_WORD,
# not a submission blocker like an over-length field.
findings:
  ASO_KEYWORD_FIELD_TOO_LONG: error
  ASO_KEYWORD_SPACES: error
  ASO_DUPLICATE_IN_FIELD: warning
  ASO_DUPLICATE_OF_TITLE: warning
  ASO_NOISE_WORD: warning
  ASO_CATEGORY_WORD: warning
  ASO_TRADEMARK_RISK: warning
  ASO_PLURAL_PAIR: warning
  ASO_UNCOVERED_TARGET: warning
  ASO_WASTED_BUDGET: info
