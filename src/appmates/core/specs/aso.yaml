# App Store keyword field rules.
#
# Apple's keyword field is 100 characters, and it is the most technical artefact
# in a store listing: it is never shown to a user, so nothing about it is
# self-correcting. A wasted character is a keyword you did not rank for.
#
# The rules below are mechanical consequences of one documented behaviour: Apple
# indexes the *words* of the app name, the subtitle and the keyword field as a
# single pool, and forms search matches by combining them. Everything else here
# follows from that.
source_url: https://developer.apple.com/app-store/product-page/
last_verified: 2026-07-26

field:
  max_length: 100
  separator: ","

# Words Apple already associates with every app, or that carry no search intent.
# Spending characters on these buys nothing.
#
# Every entry is quoted deliberately. YAML 1.1 reads bare `on`, `off`, `yes`,
# `no`, `y` and `n` as booleans, so an unquoted `on` in this list arrives as
# `True` and fails validation — or worse, in a laxer schema, silently stops
# matching the word it was meant to catch.
noise_words:
  - "app"
  - "apps"
  - "free"
  - "best"
  - "top"
  - "new"
  - "the"
  - "and"
  - "for"
  - "with"
  - "your"
  - "my"
  - "a"
  - "an"
  - "to"
  - "of"
  - "in"
  - "on"
  - "it"
  - "is"
  # French equivalents: AppMates is used on localised listings too.
  - "le"
  - "la"
  - "les"
  - "un"
  - "une"
  - "des"
  - "du"
  - "de"
  - "et"
  - "pour"
  - "avec"
  - "votre"
  - "mon"
  - "ma"
  - "mes"

# Grammar words, for mining competitor *descriptions*.
#
# Kept separate from `noise_words` on purpose: that list answers "Apple already
# indexes this, so do not spend keyword characters on it", which is a different
# question from "this word is prose scaffolding, not vocabulary". Merging them
# would make the keyword auditor start flagging perfectly good keywords, and
# leave description mining full of "you", "more" and "from".
prose_stopwords:
  - "you"
  - "your"
  - "yours"
  - "our"
  - "them"
  - "they"
  - "this"
  - "that"
