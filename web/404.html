<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — AppMates</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="./assets/icon.svg">
<link rel="apple-touch-icon" href="./assets/icon.svg">
<link rel="stylesheet" href="./styles.css">
<style>
  /* Cloudflare Pages serves this file automatically for any path that
     doesn't match a real route or asset — no config, no redirect rule,
     just this file's presence at the deploy root. Reuses styles.css
     directly (not a copy of its palette) so it never drifts from the
     rest of the site's light/dark theme. */
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--text);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
    padding: 1.5rem; box-sizing: border-box;
  }
  .card { max-width: 26rem; text-align: center; }
  .code { font-size: .8rem; font-weight: 700; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
  h1 { font-size: 1.3rem; margin: .4rem 0 .6rem; }
  p { color: var(--text-2); margin: 0 0 1.4rem; }
  .links { display: flex; gap: .6rem; justify-content: center; flex-wrap: wrap; }
  a.button {
    display: inline-block; padding: .55rem 1rem; border-radius: 10px;
    text-decoration: none; font-weight: 650; font-size: .88rem;
  }
  a.primary { background: linear-gradient(140deg, var(--accent), var(--accent-strong)); color: var(--on-accent); }
  a.ghost { border: 1px solid var(--border-strong); color: var(--text); }
</style>
</head>
<body>
  <div class="card">
    <div class="code">404</div>
    <h1>That page doesn't exist</h1>
    <p>The link might be old, or mistyped. Everything else still works.</p>
    <div class="links">
      <a class="button primary" href="./">Go to AppMates</a>
      <a class="button ghost" href="./app.html">Open the dashboard</a>
    </div>
  </div>
</body>
</html>
